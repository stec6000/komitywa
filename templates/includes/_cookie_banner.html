{# Cookie consent banner - RODO compliance (LEGAL-03) #}
<div id="cookie-banner" class="cookie-banner" role="alert" aria-live="polite">
    <div class="container d-flex justify-content-between align-items-center py-3">
        <p class="mb-0 me-3">
            Ta strona korzysta z plików cookie w celu zapewnienia najlepszej jakości usług.
        </p>
        <div class="d-flex gap-2 flex-shrink-0">
            <button id="cookie-reject" class="btn cookie-btn-reject btn-sm">Odrzuć</button>
            <button id="cookie-accept" class="btn cookie-btn-accept btn-sm">Akceptuj</button>
        </div>
    </div>
</div>
