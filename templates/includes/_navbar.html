{% load static %}
<nav class="nav" aria-label="Główna nawigacja">
    <div class="nav-inner">
        <a class="nav-brand" href="{% url 'home' %}">
            <span class="dot" aria-hidden="true"></span>
            Kuchenna Komitywa
            <span class="nav-brand-sub">— roślinna kuchnia</span>
        </a>

        <button class="nav-toggle" type="button" aria-controls="mainNav" aria-expanded="false" aria-label="Menu">
            <span class="bar" aria-hidden="true"></span>
        </button>

        <div class="nav-links" id="mainNav">
            <a class="{% if request.resolver_match.app_name == 'recipes' %}active{% endif %}" href="{% url 'recipes:list' %}">przepiśnik</a>
            <a class="{% if request.resolver_match.app_name == 'shop' %}active{% endif %}" href="{% url 'shop:list' %}">sklep</a>
            <a class="{% if request.resolver_match.url_name == 'about' %}active{% endif %}" href="{% url 'about' %}">o nas</a>
            <a class="{% if request.resolver_match.url_name == 'contact' %}active{% endif %}" href="{% url 'contact' %}">kontakt</a>
        </div>

        <a class="nav-cart" href="{% url 'shop:cart' %}" aria-label="Koszyk">
            <span class="nav-cart-label">koszyk</span>
            <span class="nav-cart-badge{% if not cart_count %} dim{% endif %}">{{ cart_count|default:"0" }}</span>
        </a>
    </div>
